# Mothership — CI/CD Pipeline
#
# Runs on every push to main and every PR.
# Stages:
#   1. TypeScript check
#   2. Vitest unit tests
#   3. Rust build (cargo check)
#   4. Python sidecar tests
#   5. Playwright E2E tests (with Vite dev server)

name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "22"
  RUST_VERSION: "1.88"
  PYTHON_VERSION: "3.12"

jobs:
  # ───────────────────────────────────────────────────────────────
  # 1. TypeScript — type checking
  # ───────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Update npm
        run: npm install -g npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  # ───────────────────────────────────────────────────────────────
  # 2. Unit tests — Vitest
  # ───────────────────────────────────────────────────────────────
  unit-tests:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Update npm
        run: npm install -g npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run

  # ───────────────────────────────────────────────────────────────
  # 3. Rust — cargo check (build validation)
  # ───────────────────────────────────────────────────────────────
  rust-check:
    name: Rust Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  # ───────────────────────────────────────────────────────────────
  # 4. Python — sidecar tests
  # ───────────────────────────────────────────────────────────────
  python-tests:
    name: Python Sidecar Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pytest
        run: pip install pytest pytest-timeout

      - name: Run sidecar tests (unit only, skip integration that need subprocess)
        run: |
          python -m pytest sidecars/tests/ \
            -v \
            -k "not SidecarProcess and not ErrorHandling and not MultipleRequests" \
            --timeout=60 \
            -W ignore::pytest.PytestDeprecationWarning

  # ───────────────────────────────────────────────────────────────
  # 5. E2E — Playwright (chromium only)
  # ───────────────────────────────────────────────────────────────
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Update npm
        run: npm install -g npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          CI: "true"

  # ───────────────────────────────────────────────────────────────
  # 6. Build — Vite production build
  # ───────────────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Update npm
        run: npm install -g npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
