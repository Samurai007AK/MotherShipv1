[package]
name = "mothership"
version = "0.1.0"
edition = "2021"
description = "Desktop AI control center with autonomous loop engine"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Error handling
thiserror = "1"

# Regex for error parsing
regex = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Terminal PTY (per-agent sessions)
portable-pty = "0.8"

# Cross-platform process signals (SIGSTOP/SIGCONT)
libc = "0.2"

# SQLite for memory/context persistence
rusqlite = { version = "0.31", features = ["bundled"] }

# System info for RAM pressure detection
sysinfo = "0.30"

# Cross-platform directory paths
dirs-next = "2.0"

# HTTP client (for Ollama API)
reqwest = { version = "0.12", features = ["json"] }

# Compression for cold storage
flate2 = "1"

# URL parsing for browser window management
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
